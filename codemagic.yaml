workflows:
  wooble-android-build:
    name: Wooble Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - keystore_credentials
      vars:
        PACKAGE_NAME: "org.wooble.messenger"
        NDK_VERSION: "27.2.12479018"
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
    scripts:
      - name: Set up Android NDK and local.properties
        script: |
          ANDROID_SDK_ROOT="/Users/builder/Library/Android/sdk"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> local.properties
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;$NDK_VERSION"

      - name: Clear Gradle Cache and Inject Keystore
        script: |
          ./gradlew clean --no-daemon
          echo "RELEASE_KEY_PASSWORD=$CM_KEYSTORE_PASSWORD" >> gradle.properties
          echo "RELEASE_STORE_PASSWORD=$CM_KEYSTORE_PASSWORD" >> gradle.properties
          echo "RELEASE_KEY_ALIAS=$CM_KEY_ALIAS" >> gradle.properties

      - name: Build Android APK
        script: |
          # සැබෑ ස්ටෑන්ඩ්අලෝන් ඇප් එක (Standalone APK) බිල්ඩ් කරන නිවැරදිම කමාන්ඩ් එක
          ./gradlew :TMessagesProj_AppStandalone:assembleRelease --no-daemon --info --stacktrace

    artifacts:
      - TMessagesProj_AppStandalone/build/outputs/apk/**/*.apk
