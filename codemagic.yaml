workflows:
  telegram-android-build:
    name: Telegram Android Custom Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - telegram_env
      vars:
        ANDROID_NDK_VERSION: "27.2.12479018"
        ANDROID_SDK_VERSION: "36"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
    scripts:
      - name: Fetch Git Submodules Recursively
        script: |
          # නිල උපදෙස්: සබ්-මොඩියුල සියල්ලම ගැඹුරින් සහ සම්පූර්ණයෙන්ම ක්ලෝන් කිරීම
          git submodule init
          git submodule update --init --recursive

      - name: Set up Keystore and Google Services Configuration
        script: |
          # නිල උපදෙස්: google-services.json නිවැරදිව TMessagesProj ෆෝල්ඩරයට සමාන්තරව තැබීම
          echo $RELEASE_KEYSTORE_BASE64 | base64 --decode > TMessagesProj/config/release.keystore
          echo $GOOGLE_SERVICES_BASE64 | base64 --decode > google-services.json

      - name: Configure gradle.properties Secrets
        script: |
          echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> gradle.properties
          echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> gradle.properties
          echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD" >> gradle.properties

      - name: Accept Android SDK Licenses and Set SDK Environment
        script: |
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin:$PATH
          yes | sdkmanager --licenses
          
          # පද්ධතියට අවශ්‍ය නිල මෙවලම් බාගත කිරීම තහවුරු කිරීම
          sdkmanager "platforms;android-$ANDROID_SDK_VERSION" "build-tools;36.0.0" "cmake;3.22.1" "ndk;$ANDROID_NDK_VERSION"

      - name: Build Android APK (Release Mode)
        script: |
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin:$PATH
          chmod +x gradlew
          
          # 💡 පැරණි CMake Cache ලිපිගොනු සම්පූර්ණයෙන්ම මකා දමා පිරිසිදු කිරීම
          ./gradlew clean
          
          # Wooble Standalone/Play Store APK එක නිල වශයෙන් ජනනය කිරීම
          ./gradlew assembleAfatRelease --no-daemon

    artifacts:
      - TMessagesProj/build/outputs/apk/afat/release/*.apk
