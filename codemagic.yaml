workflows:
  telegram-android-build:
    name: Telegram Android Custom Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - telegram_env
      vars:
        ANDROID_NDK_VERSION: "27.2.12479018"
        ANDROID_SDK_VERSION: "36"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
    scripts:
      - name: Fetch Git Submodules Recursively
        script: |
          git submodule init
          git submodule update --init --recursive --depth=1

      - name: Set up Keystore and Google Services Configuration
        script: |
          echo $RELEASE_KEYSTORE_BASE64 | base64 --decode > TMessagesProj/config/release.keystore
          echo $GOOGLE_SERVICES_BASE64 | base64 --decode > TMessagesProj/google-services.json

      - name: Configure gradle.properties Secrets
        script: |
          echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> gradle.properties
          echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> gradle.properties
          echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD" >> gradle.properties

      - name: Accept Android SDK Licenses and Set SDK Environment
        script: |
          # 💡 Codemagic පද්ධතියේ පවතින නිවැරදි sdkmanager පථයන් (Paths) එක් කිරීම
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin:$PATH
          
          # බලපත්‍ර ස්වයංක්‍රීයව පිළිගැනීම සහ SDK 36 මෙවලම් බාගත කිරීම
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-$ANDROID_SDK_VERSION" "build-tools;36.0.0"

      - name: Build Android APK (Release Mode)
        script: |
          # 💡 මෙතැනටද පද්ධති පථයන් එක් කර Local Wrapper එක මඟින් සාර්ථකව බිල්ඩ් කිරීම
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin:$PATH
          chmod +x gradlew
          ./gradlew assembleAfatRelease --no-daemon

    artifacts:
      - TMessagesProj/build/outputs/apk/afat/release/*.apk
