workflows:
  wooble-android-build:
    name: Wooble Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - keystore_credentials # Codemagic වල හදන Variable Group එකේ නම
      vars:
        PACKAGE_NAME: "org.wooble.messenger"
        NDK_VERSION: "27.2.12479018"
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
    scripts:
      - name: Set up Android NDK and local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> local.properties
          
          # බිල්ඩ් එකට අවශ්‍ය NDK එක සර්වර් එක ඇතුළේ ඩවුන්ලෝඩ් කරගැනීම
          sdkmanager --install "ndk;$NDK_VERSION"

      - name: Build Android APK
        script: |
          ./gradlew assembleTMessagesProjRelease --no-daemon --stacktrace

    artifacts:
      - TMessagesProj/build/outputs/apk/**/*.apk
